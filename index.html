<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Reportes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Overlay para menú en móviles -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Barra Lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-icon">🗳️</span>
        <span class="brand-title">Resultados</span>
      </div>
      <button class="close-btn" id="close-sidebar" aria-label="Cerrar menú">✕</button>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-title">SELECCIONA UN REPORTE</span>
      <ul>
        <li>
          <button class="nav-btn active" data-target="iframe-alcaldias" data-title="Resultados Alcaldías">
            <span class="nav-icon">🏛️</span>
            <span class="nav-text">Resultados Alcaldías</span>
          </button>
        </li>
        <li>
          <button class="nav-btn" data-target="iframe-distritos" data-title="Resultados Distritos Locales">
            <span class="nav-icon">🗺️</span>
            <span class="nav-text">Distritos Locales</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="toggle-btn" id="toggle-sidebar" aria-label="Abrir menú">
        ☰
      </button>
      <h1 class="report-title" id="current-title">Resultados Alcaldías</h1>
    </header>

    <main class="content-area">
      <div class="chart-card">
        
        <!-- Iframe 1: Alcaldías (Visible por defecto) -->
        <iframe 
          id="iframe-alcaldias"
          class="flourish-report active"
          src="https://flo.uri.sh/visualisation/29990496/embed" 
          title="Resultados Alcaldías" 
          frameborder="0" 
          scrolling="no" 
          style="width:100%;height:600px;" 
          sandbox="allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation">
        </iframe>

        <!-- Iframe 2: Distritos Locales (Oculto por defecto) -->
        <iframe 
          id="iframe-distritos"
          class="flourish-report"
          src="https://flo.uri.sh/visualisation/29972342/embed" 
          title="Resultados Distritos Locales" 
          frameborder="0" 
          scrolling="no" 
          style="width:100%;height:600px;" 
          sandbox="allow-same-origin allow-forms allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation">
        </iframe>

      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
