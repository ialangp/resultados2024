<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Reportes Electorales</title>
  <link rel="stylesheet" href="style.css">
  <!-- Script oficial de Flourish -->
  <script src="https://public.flourish.studio/resources/embed.js"></script>
</head>
<body>

  <!-- Overlay para menú en móviles -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Barra Lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-icon">🗳️</span>
        <span class="brand-title">Electorales</span>
      </div>
      <button class="close-btn" id="close-sidebar" aria-label="Cerrar menú">✕</button>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-title">SELECCIONA NIVEL</span>
      <ul>
        <li>
          <button class="nav-btn active" data-target="seccion-alcaldias" data-title="Alcaldías">
            <span class="nav-icon">🏛️</span>
            <span class="nav-text">Alcaldías</span>
          </button>
        </li>
        <li>
          <button class="nav-btn" data-target="seccion-distritos" data-title="Distritos Locales">
            <span class="nav-icon">🗺️</span>
            <span class="nav-text">Distritos Locales</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    <header class="topbar">
      <button class="toggle-btn" id="toggle-sidebar" aria-label="Abrir menú">
        ☰
      </button>
      <h1 class="report-title" id="current-title">Alcaldías</h1>
    </header>

    <main class="content-area">
      
      <!-- SECCIÓN: ALCALDÍAS -->
      <div id="seccion-alcaldias" class="level-section active">
        <!-- Pestañas de Módulos para Alcaldías -->
        <div class="module-tabs">
          <button class="tab-btn active" data-module="alcaldias-resultados">Resultados</button>
          <button class="tab-btn" data-module="alcaldias-competitividad">Bloques de competitividad</button>
          <button class="tab-btn" data-module="alcaldias-candidatos">Candidatos</button>
          <button class="tab-btn" data-module="rentabilidad-alcaldias">Rentabilidad</button>
        </div>

        <div class="chart-card">
          <!-- Módulo Resultados Alcaldías -->
          <div id="alcaldias-resultados" class="report-container active">
            <div class="flourish-embed flourish-chart" data-src="visualisation/29990496"></div>
          </div>
          <!-- Módulo Bloques de Competitividad Alcaldías -->
          <div id="alcaldias-competitividad" class="report-container">
            <div class="flourish-embed flourish-chart" data-src="visualisation/29971866"></div>
          </div>
          <!-- Módulo Candidatos Alcaldías -->
          <div id="alcaldias-candidatos" class="report-container">
            <div class="candidates-filters">
              <div class="filter-group">
                <label for="search-alcaldias">Buscar por nombre:</label>
                <input type="text" id="search-alcaldias" placeholder="Escribe el nombre del candidato..." class="filter-input">
              </div>
              <div class="filter-group">
                <label for="select-alcaldias">Filtrar por Alcaldía:</label>
                <select id="select-alcaldias" class="filter-select">
                  <option value="">Todas las Alcaldías</option>
                </select>
              </div>
            </div>

            <!-- NUEVO CONTENEDOR DE RENTABILIDAD -->
            <div id="rentabilidad-alcaldias" class="report-container">
              <!-- Aquí puedes insertar tu gráfico/mapa de Flourish, iframe o tabla -->
              
            </div>

            
            <div id="grid-alcaldias" class="candidates-grid"></div>
          </div>
        </div>
      </div>

      <!-- SECCIÓN: DISTRITOS LOCALES -->
      <div id="seccion-distritos" class="level-section">
        <!-- Pestañas de Módulos para Distritos Locales -->
        <div class="module-tabs">
          <button class="tab-btn active" data-module="distritos-resultados">Resultados</button>
          <button class="tab-btn" data-module="distritos-competitividad">Bloques de competitividad</button>
          <button class="tab-btn" data-module="distritos-candidatos">Candidatos</button>
          <button class="tab-btn" data-module="rentabilidad-distritos">Rentabilidad</button>
        </div>

        <div class="chart-card">
          <!-- Módulo Resultados Distritos -->
          <div id="distritos-resultados" class="report-container active">
            <div class="flourish-embed flourish-chart" data-src="visualisation/29972342"></div>
          </div>
          <!-- Módulo Competitividad Distritos -->
          <div id="distritos-competitividad" class="report-container">
            <div class="flourish-embed flourish-chart" data-src="visualisation/29970837"></div>
          </div>
          <!-- Módulo Candidatos Distritos -->
          <div id="distritos-candidatos" class="report-container">
            <div class="candidates-filters">
              <div class="filter-group">
                <label for="search-distritos">Buscar por nombre:</label>
                <input type="text" id="search-distritos" placeholder="Escribe el nombre del candidato..." class="filter-input">
              </div>
              <div class="filter-group">
                <label for="select-distritos">Filtrar por Distrito:</label>
                <select id="select-distritos" class="filter-select">
                  <option value="">Todos los Distritos</option>
                </select>
              </div>
              <div class="filter-group">
                <label for="select-acciones-distritos">Acción afirmativa:</label>
                <select id="select-acciones-distritos" class="filter-select">
                  <option value=""></option>
                  <option value="__TODAS_ACCIONES__">Todas las Acciones Afirmativas</option>
                  </select>  
              </div>
            </div>
            
            <!-- Modulo Rentabilidad Distritos Locales-->
            <div id="rentabilidad-distritos" class="report-container">
              <!-- Aquí insertas la visualización correspondiente a Distritos -->
            
            </div>
            <div id="grid-distritos" class="candidates-grid"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>

  <div id="image-modal" class="image-modal">
  <div class="modal-content-wrapper">
    <button type="button" class="modal-close" id="modal-close" aria-label="Cerrar">&times;</button>
    <img id="modal-img" class="modal-img" src="" alt="Foto ampliada">
    <div id="modal-caption" class="modal-caption"></div>
  </div>
</div>
</body>
</html>
